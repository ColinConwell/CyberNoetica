<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cybernoetica</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
      color: rgba(255, 255, 255, 0.92);
    }

    .bg {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 50% 40%, rgba(20, 16, 40, 1) 0%, #000 70%);
    }

    .container {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
    }

    .card {
      width: 380px; max-width: 90vw; padding: 48px 36px;
      background: rgba(8, 8, 16, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .title {
      font-size: 22px; font-weight: 300;
      letter-spacing: 0.12em; text-align: center;
      margin-bottom: 8px; text-transform: uppercase;
    }

    .subtitle {
      font-size: 13px; text-align: center;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 36px;
    }

    label {
      display: block; font-size: 11px; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 6px;
    }

    input {
      width: 100%; padding: 12px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.92);
      font-size: 15px; font-family: inherit;
      outline: none;
      transition: border-color 0.25s ease;
      margin-bottom: 20px;
    }
    input:focus {
      border-color: rgba(140, 160, 255, 0.5);
    }
    input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    button {
      width: 100%; padding: 14px;
      background: rgba(140, 160, 255, 0.15);
      border: 1px solid rgba(140, 160, 255, 0.3);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.92);
      font-size: 14px; font-family: inherit;
      font-weight: 500; letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 8px;
    }
    button:hover {
      background: rgba(140, 160, 255, 0.25);
      border-color: rgba(140, 160, 255, 0.5);
    }
    button:active {
      transform: scale(0.98);
    }
    button:disabled {
      opacity: 0.5; cursor: not-allowed;
    }

    .error {
      font-size: 13px; color: rgba(255, 120, 120, 0.9);
      text-align: center; margin-top: 16px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="container">
    <div class="card">
      <div class="title">Cybernoetica</div>
      <div class="subtitle">Preview access</div>
      <form id="form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Access code" required autocomplete="current-password" />
        <button type="submit">Enter</button>
      </form>
      <div class="error" id="error"></div>
    </div>
  </div>
  <script>
    const form = document.getElementById('form');
    const errorEl = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      const btn = form.querySelector('button');
      btn.disabled = true;
      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: form.email.value,
            password: form.password.value,
          }),
        });
        const data = await res.json();
        if (data.success) {
          window.location.reload();
        } else {
          errorEl.textContent = data.error || 'Access denied';
        }
      } catch {
        errorEl.textContent = 'Connection error';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
